# Load balancer for the Silo cluster.
# Mirrors nginx-minio.conf exactly, apart from hostnames. Any change here must
# be made in both files, or the proxy becomes a variable between the MinIO and
# Silo benchmark runs: same machine, topology, limits, storage, dataset,
# parameters and repetition count.

upstream silo_nodes {
    server silo-1:9000 max_fails=0;
    server silo-2:9000 max_fails=0;
    server silo-3:9000 max_fails=0;
    server silo-4:9000 max_fails=0;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # Local health endpoint, used by the container healthcheck. Mirrors the
    # MinIO proxy exactly and does not touch an upstream, so it stays green
    # while a node is restarting during fault injection.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "lb-silo ok\n";
    }

    location /minio/health/ {
        proxy_pass http://silo_nodes;
        access_log off;
    }

    location / {
        proxy_pass http://silo_nodes;
        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}