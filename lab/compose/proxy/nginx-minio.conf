# Load balancer for the MinIO baseline cluster.
# Mirrored by nginx-silo.conf for the Silo cluster — keep the two in step.

upstream minio_nodes {
    # Round robin across all 4 nodes so client load is spread the same way it
    # would be in the reference topology.
    server minio-1:9000 max_fails=0;
    server minio-2:9000 max_fails=0;
    server minio-3:9000 max_fails=0;
    server minio-4:9000 max_fails=0;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Object uploads can be large; do not buffer them through nginx to disk.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;

    # S3 signed requests depend on the exact Host header being preserved.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # Local health endpoint, used by the container healthcheck. Deliberately does
    # not touch an upstream, so it stays green even while a node is being
    # restarted during ST05 fault injection.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "lb-minio ok\n";
    }

    # MinIO health probes return 200 on /minio/health/live.
    location /minio/health/ {
        proxy_pass http://minio_nodes;
        access_log off;
    }

    location / {
        proxy_pass http://minio_nodes;
        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}