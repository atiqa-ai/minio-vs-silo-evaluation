# Silo cluster — 4 nodes x 1 drive, single erasure pool.
#
# This file is the Silo half of the comparison and is deliberately a structural
# mirror of ../minio/compose.yml: same node count, same drive count, same CPU and
# memory limits, same bind-mount layout, same published console, same health
# check, same server arguments.
#
# G4: every cluster must be a single product at a single version.
# Nothing in this file may ever reference a MinIO node, and nothing in
# ../minio/compose.yml may ever reference a Silo node.
# G6 comparable-environment rule: this file must stay in step with the
# MinIO file; if one is changed, both are changed in the same commit.
#
# Only differences from the MinIO file:
#   1. image      -> the Silo RELEASE.* image
#   2. hostnames  -> silo-1..4 instead of minio-1..4 (separate project namespace)
#   3. server arg -> the server binary is named `silo`, not `minio`.
#      Silo's entrypoint also accepts `minio server ...` and bare `server ...`
#      as aliases; that alias behaviour is exercised in ST07, so this file uses
#      the explicit binary name and does not depend on the alias.

name: silo-cluster

x-silo-common: &silo-common
  image: ${SILO_IMAGE}
  restart: unless-stopped
  networks: [migration-net]
  # Identical limits on every node; matches the MinIO cluster exactly.
  deploy:
    resources:
      limits:
        cpus: "${NODE_CPUS}"
        memory: ${NODE_MEM}
  environment: &silo-env
    MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    # Identical to the MinIO cluster: the cluster metrics endpoint answers 403
    # without it, and the `monitoring` project needs it. Keeping the
    # variable identical is what makes the two metric surfaces comparable.
    MINIO_PROMETHEUS_AUTH_TYPE: "public"
  healthcheck:
    # Identical mechanism to the MinIO cluster so the health signal is not a
    # variable between the two products.
    test: ["CMD-SHELL", "timeout 3 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9000' || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s
  command: &silo-command
    - server
    - --address
    - ":9000"
    - --console-address
    - ":9001"
    - http://silo-1:9000/data
    - http://silo-2:9000/data
    - http://silo-3:9000/data
    - http://silo-4:9000/data

services:
  silo-1:
    <<: *silo-common
    container_name: silo-1
    volumes:
      - ../../data/silo/node-1:/data
    ports:
      - "${BIND_ADDR}:${SILO_CONSOLE_PORT}:9001"
    command: *silo-command

  silo-2:
    <<: *silo-common
    container_name: silo-2
    volumes:
      - ../../data/silo/node-2:/data

  silo-3:
    <<: *silo-common
    container_name: silo-3
    volumes:
      - ../../data/silo/node-3:/data

  silo-4:
    <<: *silo-common
    container_name: silo-4
    volumes:
      - ../../data/silo/node-4:/data

# Same shared lab network as the MinIO cluster. External because
# Compose must not own it. The two clusters share the network but never share
# membership: no service in this file references a minio-* node.
networks:
  migration-net:
    external: true
    name: migration-net